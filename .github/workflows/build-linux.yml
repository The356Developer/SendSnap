name: Build Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libblkid-dev \
            libayatana-appindicator3-dev \
            patchelf \
            file \
            squashfs-tools \
            wget

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.5'
          cache: true

      - name: Install appimagetool
        run: |
          sudo wget -qO /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build Linux release bundle
        working-directory: sendsnap
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Package tar.gz, .deb, and .AppImage
        working-directory: sendsnap
        run: |
          mkdir -p dist/linux
          tar -C build/linux/x64/release/bundle -czf dist/linux/sendsnap-linux-x64.tar.gz .
          bash packaging/linux/build_deb.sh --skip-build
          bash packaging/linux/build_appimage.sh --skip-build
          ls -lh dist/linux/

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sendsnap-linux-x64
          path: sendsnap/dist/linux/*
